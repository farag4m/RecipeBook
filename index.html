<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Family Recipe Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF4DC;
    --paper-raised:#FFFFFF;
    --ink:#171512;
    --ink-soft:#4A453D;
    --rule-red:#EE3E36;
    --sage:#2F6FED;
    --sage-deep:#1E4FB8;
    --butter:#FFCC29;
    --line:#171512;
    --pop:#3FB84F;
    --shadow:4px 4px 0 var(--ink);
    --shadow-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;}
  html,body{max-width:100%;overflow-x:hidden;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Comic Neue', sans-serif;
    font-weight:700;
    background-image:radial-gradient(circle, rgba(23,21,18,0.14) 1.6px, transparent 1.6px);
    background-size:16px 16px;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;min-width:0;}
  .header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;border-bottom:5px solid var(--ink);padding-bottom:18px;margin-bottom:26px;}
  .header h1{font-family:'Bangers', cursive;font-weight:400;font-size:clamp(30px,8vw,56px);margin:0;letter-spacing:.02em;color:var(--rule-red);text-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg);}
  .header .sub{font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-top:8px;}
  .err-banner{color:var(--rule-red);text-transform:none;letter-spacing:0;}
  .header-actions{display:flex;gap:10px;flex-wrap:wrap;}
  button{font-family:'Bangers', cursive;letter-spacing:.03em;cursor:pointer;border:3px solid var(--ink);border-radius:8px;font-size:16px;font-weight:400;padding:10px 18px;box-shadow:var(--shadow-sm);transition:transform .1s ease, box-shadow .1s ease;}
  button:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);}
  button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);}
  button:disabled{opacity:.55;cursor:not-allowed;transform:none;}
  .btn-primary{background:var(--sage);color:#fff;}
  .btn-ai{background:var(--butter);color:var(--ink);}
  .btn-ghost{background:var(--paper-raised);color:var(--ink);}
  .btn-danger{background:var(--rule-red);color:#fff;}
  .btn-small{padding:7px 12px;font-size:13px;}
  .layout{display:flex;gap:26px;align-items:flex-start;}
  .tabs{display:flex;flex-direction:column;gap:8px;min-width:140px;position:sticky;top:20px;}
  .tab{font-family:'Bangers', cursive;letter-spacing:.03em;font-size:15px;text-transform:uppercase;padding:9px 12px;border:3px solid var(--ink);background:var(--paper-raised);cursor:pointer;color:var(--ink-soft);border-radius:8px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s ease;}
  .tab:hover{transform:translate(-1px,-1px);}
  .tab.active{background:var(--rule-red);color:#fff;}
  .tab .count{opacity:.75;margin-left:3px;}
  .tab-icon{font-size:20px;vertical-align:middle;}
  .main{flex:1;min-width:0;max-width:100%;}
  .search-row{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:18px;}
  .search{width:100%;padding:11px 14px;border:3px solid var(--ink);border-radius:8px;font-family:'Comic Neue';font-weight:700;font-size:14px;background:var(--paper-raised);box-shadow:var(--shadow-sm);}
  .search:focus{outline:none;border-color:var(--sage);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(240px,1fr));gap:22px;}
  @media (max-width:760px){
    .grid{grid-template-columns:1fr 1fr;gap:12px;}
    .card{border-width:3px;border-radius:12px;}
    .card h3{font-size:17px;}
    .card-body{padding:10px 10px 9px;}
    .card .meta{font-size:10.5px;padding-top:7px;gap:4px;}
    .card-cat{font-size:10px;padding:1px 8px;top:7px;left:7px;border-width:2px;}
    .card-cover.blank span{font-size:44px;}
  }
  .card{background:var(--paper-raised);border:4px solid var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:0;overflow:hidden;position:relative;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s ease, box-shadow .12s ease;}
  .card:hover{transform:translate(-3px,-3px) rotate(-0.6deg);box-shadow:7px 7px 0 var(--ink);}
  .card-cover{position:relative;aspect-ratio:4/3;overflow:hidden;border-bottom:4px solid var(--ink);background:var(--cover-a);}
  .card-cover img{width:100%;height:100%;object-fit:cover;display:block;}
  /* No art yet: a tinted ground with the category mark, still looks deliberate. */
  .card-cover.blank{background:linear-gradient(140deg,var(--cover-a),var(--cover-b));display:flex;align-items:center;justify-content:center;}
  .card-cover.blank span{font-size:64px;line-height:1;transform:rotate(-6deg);filter:drop-shadow(3px 3px 0 rgba(23,21,18,.25));}
  .card-pending{position:absolute;top:10px;right:10px;font-family:'Comic Neue';font-weight:700;font-size:10.5px;background:var(--butter);border:2.5px solid var(--ink);border-radius:20px;padding:2px 8px;box-shadow:2px 2px 0 var(--ink);}
  .card-cat{position:absolute;top:10px;left:10px;font-family:'Bangers';font-size:12px;letter-spacing:.05em;text-transform:uppercase;background:var(--paper-raised);border:2.5px solid var(--ink);border-radius:20px;padding:2px 10px;box-shadow:2px 2px 0 var(--ink);}
  .card-body{padding:14px 14px 12px;display:flex;flex-direction:column;flex:1;}
  .card h3{font-family:'Bangers', cursive;font-weight:400;font-size:23px;margin:0;line-height:1.12;letter-spacing:.02em;}
  .card .meta{margin-top:auto;padding-top:10px;font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty b{display:block;font-family:'Bangers';font-weight:400;font-size:30px;color:var(--rule-red);margin-bottom:8px;letter-spacing:.03em;}
  .overlay{position:fixed;inset:0;background:rgba(23,21,18,0.6);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;}
  .modal{background:var(--paper-raised);width:100%;max-width:560px;overflow-x:hidden;max-height:86vh;overflow-y:auto;border-radius:12px;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:26px 28px 24px;position:relative;}
  .modal.wide{max-width:720px;}
  /* The modal is the scroll container, so an absolutely positioned close
     button scrolls out of reach. Sticky keeps it pinned while you read. */
  .modal-close{position:sticky;top:0;float:right;z-index:30;background:var(--rule-red);color:#fff;border:3px solid var(--ink);border-radius:50%;width:40px;height:40px;font-size:22px;line-height:1;padding:0;margin:-10px -10px 0 10px;box-shadow:2px 2px 0 var(--ink);flex-shrink:0;}
  .modal-close:hover{transform:none;box-shadow:3px 3px 0 var(--ink);}
  .modal h2{font-family:'Bangers', cursive;font-weight:400;font-size:32px;margin:0 0 6px;padding-right:8px;clear:none;letter-spacing:.02em;}
  .modal .rule{height:4px;background:var(--rule-red);margin:14px 0;border-radius:2px;}
  .modal .field-label{font-family:'Bangers', cursive;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--sage-deep);margin:16px 0 8px;}
  .modal-icon{font-size:56px;line-height:1;transform:rotate(-3deg);}
  .ing-grid{display:flex;flex-wrap:wrap;gap:8px;min-width:0;}
  .ing-chip{display:flex;align-items:center;gap:6px;max-width:100%;overflow-wrap:anywhere;background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;padding:6px 12px;font-size:13px;box-shadow:2px 2px 0 var(--ink);}
  .ing-emoji{font-size:18px;}
  .step-list{display:flex;flex-direction:column;gap:10px;}
  .step-row{display:flex;align-items:flex-start;gap:10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;padding:9px 12px;font-size:13.5px;box-shadow:2px 2px 0 var(--ink);}
  .step-num{flex-shrink:0;background:var(--rule-red);color:#fff;border:2px solid var(--ink);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-family:'Bangers';font-size:14px;}
  .step-emoji{font-size:18px;flex-shrink:0;}
  .step-card{background:#f8f2e2;border:3px solid var(--ink);border-radius:22px;padding:18px;box-shadow:var(--shadow-sm);}
  .step-header{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
  .step-number-big{width:48px;height:48px;background:var(--rule-red);border:3px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Bangers';font-size:24px;flex-shrink:0;}
  .step-title{font-family:'Bangers';font-size:23px;line-height:1.1;letter-spacing:.02em;color:var(--ink);}
  .step-caption{font-size:13.5px;line-height:1.45;color:var(--ink-soft);margin:0 0 12px 66px;}
  .step-card img{display:block;width:100%;border:3px solid var(--ink);border-radius:12px;background:#fff;}
  .comic-book{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .full-steps{margin-top:16px;border:3px dashed var(--ink);border-radius:10px;background:#FFF0B8;padding:10px 12px;}
  .full-steps summary{font-family:'Bangers';font-size:15px;letter-spacing:.04em;cursor:pointer;color:var(--sage-deep);}
  .full-steps .step-list{margin-top:10px;}
  .comic-chapter{font-family:'Bangers';font-size:15px;letter-spacing:.04em;background:var(--butter);border:3px solid var(--ink);border-radius:20px;padding:3px 14px;box-shadow:2px 2px 0 var(--ink);align-self:flex-start;margin-top:6px;}
  .comic-panel{display:block;width:100%;max-width:100%;height:auto;border:4px solid var(--ink);border-radius:12px;background:#FFF4DC;box-shadow:var(--shadow-sm);}
  /* Two up only where there is real room; a phone always gets one per row. */
  @media (min-width:900px){
    .comic-book{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
    .full-steps{margin-top:16px;border:3px dashed var(--ink);border-radius:10px;background:#FFF0B8;padding:10px 12px;}
  .full-steps summary{font-family:'Bangers';font-size:15px;letter-spacing:.04em;cursor:pointer;color:var(--sage-deep);}
  .full-steps .step-list{margin-top:10px;}
  .comic-chapter{grid-column:1/-1;}
  }
  .gen-steps{display:grid;gap:6px;margin-top:10px;}
  .gen-step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);font-family:'Comic Neue';letter-spacing:0;text-transform:none;}
  .gen-step .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);flex-shrink:0;}
  .gen-step.done .dot{background:var(--pop);}
  .gen-step.active .dot{background:var(--butter);}
  .gen-step.failed .dot{background:var(--rule-red);}
  .modal .notes{color:var(--ink);font-size:13.5px;line-height:1.5;background:#FFF0B8;border:2px dashed var(--ink);padding:10px 12px;border-radius:8px;margin-top:14px;}
  .modal .footer-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px;font-size:12.5px;color:var(--ink-soft);}
  .modal-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .confirm-row{display:flex;align-items:center;gap:8px;font-size:13.5px;flex-wrap:wrap;}
  label{display:block;font-family:'Bangers', cursive;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text], select, textarea{width:100%;padding:9px 11px;border:2.5px solid var(--ink);border-radius:6px;font-family:'Comic Neue';font-weight:700;font-size:14px;background:#fff;color:var(--ink);}
  textarea{font-size:13.5px;line-height:1.6;resize:vertical;}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--sage);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;text-transform:none;font-family:'Comic Neue';letter-spacing:0;}
  .tool-box{background:#FFF0B8;border:3px dashed var(--ink);border-radius:10px;padding:16px;margin-bottom:6px;}
  .share-link{word-break:break-all;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:10px;font-size:12px;margin-top:10px;}
  .status-line{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.45;}
  .error-msg{color:var(--rule-red);font-size:13px;font-weight:700;margin-top:8px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--pop);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:12px 20px;font-family:'Bangers';font-size:16px;letter-spacing:.02em;box-shadow:4px 4px 0 var(--ink);opacity:0;transition:opacity .25s ease, transform .25s ease;z-index:100;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (max-width:760px){
    .overlay{padding:8px;}
    .modal{max-height:94vh;}
    .layout{flex-direction:column;}
    .tabs{flex-direction:row;flex-wrap:wrap;position:static;width:100%;min-width:0;}
    .header h1{font-size:clamp(28px,8vw,40px);}
    .search-row{grid-template-columns:1fr;}
    .row2{grid-template-columns:1fr;}
    .modal{padding:24px 18px 20px;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div>
      <h1>The Family Recipe Box</h1>
      <div class="sub" id="subcount">loading recipes...</div>
    </div>
    <div class="header-actions">
      <button class="btn-ai" id="btnFormat">✨ Smart Add</button>
      <button class="btn-primary" id="btnAdd">+ Add Recipe</button>
    </div>
  </div>

  <div class="layout">
    <div class="tabs" id="tabs"></div>
    <main class="main">
      <div class="search-row">
        <input class="search" id="search" type="text" placeholder="Search recipes by name...">
        
      </div>
      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>

<script>
const CATEGORIES = ["Breakfast","Mains","Sides","Desserts","Drinks","Snacks","Other"];
const CAT_ICON = {Breakfast:"🍳",Mains:"🍝",Sides:"🥗",Desserts:"🍰",Drinks:"🥤",Snacks:"🍿",Other:"⭐"};
// Cover tints, used behind the category mark when a recipe has no art yet.
const CAT_TINT = {
  Breakfast:["#FFD98A","#F6B24A"], Mains:["#F5A97F","#E2705A"], Sides:["#BFD9A3","#8FB574"],
  Desserts:["#F7B8CE","#E58AAE"], Drinks:["#A9D5E8","#6FAECF"], Snacks:["#FFE08A","#F2C14E"],
  Other:["#E4D5BC","#C9B392"]
};
const API_KEY_STORE = "family-recipe-box:api";
const POLL_MS = 30000;

// Recipes live on the server. When the site is served by that server the
// origin is already right; only a separate static host needs an override.
const DEFAULT_API = "https://family-recipe-box.onrender.com";
function apiBase(){
  const stored = (localStorage.getItem(API_KEY_STORE) || "").trim();
  if(stored) return stored.replace(/\/+$/, "");
  if(location.protocol === "http:" || location.protocol === "https:"){
    if(!/github\.io$/i.test(location.hostname)) return location.origin;
  }
  return DEFAULT_API;
}
function apiUrl(path){ return apiBase() + path; }

let recipes = [];
let activeCat = "All";
let searchTerm = "";
let lastError = "";
let syncTimer = null;
let syncInFlight = false;

const grid = document.getElementById("grid");
const tabsEl = document.getElementById("tabs");
const subcount = document.getElementById("subcount");

function escapeHtml(s){ return String(s || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

// --- api -------------------------------------------------------------------

async function api(path, options = {}){
  const res = await fetch(apiUrl(path), {
    cache:"no-store",
    ...options,
    headers:{"Content-Type":"application/json", ...(options.headers || {})}
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok || data.ok === false){
    const err = new Error(data.error || `Server error ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return data;
}

function imageUrl(comic){
  const url = comic.url || "";
  return /^https?:/i.test(url) ? url : apiUrl(url);
}

async function loadRecipes(silent = false){
  if(syncInFlight) return;
  syncInFlight = true;
  if(!silent) subcount.textContent = "loading recipes...";
  try{
    const data = await api("/api/recipes");
    recipes = data.recipes || [];
    lastError = "";
  }catch(e){
    lastError = "Could not reach the recipe service (" + (e.message || "network error") + ").";
  }finally{
    syncInFlight = false;
    render();
  }
}

// Quietly picks up recipes added from another device.
function startBackgroundRefresh(){
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(() => loadRecipes(true), POLL_MS);
}

// --- icons -----------------------------------------------------------------

const ING_ICONS = [
  [/egg/i,"🥚"],[/flour/i,"🌾"],[/sugar/i,"🍬"],[/butter/i,"🧈"],[/milk|cream/i,"🥛"],
  [/cheese/i,"🧀"],[/chicken/i,"🍗"],[/beef|steak/i,"🥩"],[/pork|bacon/i,"🥓"],[/fish|salmon|shrimp/i,"🐟"],
  [/garlic/i,"🧄"],[/onion/i,"🧅"],[/tomato/i,"🍅"],[/potato/i,"🥔"],[/carrot/i,"🥕"],
  [/pepper(?!corn)/i,"🌶️"],[/salt/i,"🧂"],[/oil/i,"🫒"],[/lemon|lime/i,"🍋"],[/rice/i,"🍚"],
  [/pasta|noodle/i,"🍝"],[/bread/i,"🍞"],[/chocolate/i,"🍫"],[/apple/i,"🍎"],[/banana/i,"🍌"],
  [/herb|basil|parsley|cilantro|mint/i,"🌿"],[/water/i,"💧"],[/wine/i,"🍷"],[/vanilla/i,"🌼"],[/nut|almond|peanut/i,"🥜"]
];
function guessIcon(text){
  for(const [re, emo] of ING_ICONS) if(re.test(text)) return emo;
  return "🔸";
}
const STEP_ICONS = [
  [/whisk|beat|mix|stir|combine/i,"🥄"],[/chop|dice|slice|mince/i,"🔪"],[/bake|oven/i,"🔥"],
  [/boil|simmer/i,"♨️"],[/fry|sauté|saute/i,"🍳"],[/grill/i,"🍢"],[/cool|chill|fridge|freeze/i,"❄️"],
  [/serve|plate/i,"🍽️"],[/marinate|rest|wait/i,"⏱️"],[/preheat/i,"🌡️"]
];
function guessStepIcon(text){
  for(const [re, emo] of STEP_ICONS) if(re.test(text)) return emo;
  return "👉";
}

// --- rendering -------------------------------------------------------------

function render(){
  const counts = {};
  CATEGORIES.forEach(c => counts[c] = 0);
  recipes.forEach(r => { counts[r.category] = (counts[r.category] || 0) + 1; });
  tabsEl.innerHTML = ["All", ...CATEGORIES].map(c => {
    const n = c === "All" ? recipes.length : (counts[c] || 0);
    const icon = c === "All" ? "🍽️" : CAT_ICON[c];
    return `<div class="tab ${activeCat === c ? "active" : ""}" data-cat="${c}"><span class="tab-icon">${icon}</span> <span class="count">${n}</span></div>`;
  }).join("");
  tabsEl.querySelectorAll(".tab").forEach(t => t.onclick = () => { activeCat = t.dataset.cat; render(); });

  let filtered = recipes.filter(r => activeCat === "All" || r.category === activeCat);
  if(searchTerm.trim()){
    const q = searchTerm.toLowerCase();
    filtered = filtered.filter(r => r.title.toLowerCase().includes(q));
  }

  subcount.innerHTML = lastError
    ? `<span class="err-banner">⚠️ ${escapeHtml(lastError)}</span>`
    : `${recipes.length} recipe${recipes.length === 1 ? "" : "s"} in the box`;

  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty"><b>Nothing here yet</b>${recipes.length === 0 ? "Add your first family recipe." : "No recipes match this view."}</div>`;
    return;
  }

  grid.innerHTML = filtered.map(r => {
    const tint = CAT_TINT[r.category] || CAT_TINT.Other;
    const cover = coverUrl(r);
    return `
    <div class="card" data-id="${escapeHtml(r.id)}" style="--cover-a:${tint[0]};--cover-b:${tint[1]}">
      ${cover
        ? `<div class="card-cover"><img src="${escapeHtml(cover)}" alt="${escapeHtml(r.title)}" loading="lazy"></div>`
        : `<div class="card-cover blank"><span>${CAT_ICON[r.category] || "⭐"}</span></div>`}
      <div class="card-cat">${escapeHtml(r.category)}</div>
      ${r.artPending ? `<div class="card-pending">🎨 comic on the way</div>` : ""}
      <div class="card-body">
        <h3>${escapeHtml(r.title)}</h3>
        <div class="meta"><span>${r.servings ? "🍽️ " + escapeHtml(r.servings) : ""}</span><span>${r.contributor ? "👤 " + escapeHtml(r.contributor) : ""}</span></div>
      </div>
    </div>`;
  }).join("");
  grid.querySelectorAll(".card").forEach(c => c.onclick = () => openView(c.dataset.id));
}

function plainStepRow(recipe, idx){
  const step = recipe.steps[idx];
  if(!step) return "";
  return `<div class="step-row"><span class="step-num">${idx + 1}</span><span class="step-emoji">${guessStepIcon(step)}</span><span>${escapeHtml(step)}</span></div>`;
}

// Comics cover consecutive runs of steps. Each strip is drawn with its panel
// captions underneath; any step no comic covers falls back to a plain row.
// The card cover uses the LAST panel - the finished dish - not the first,
// which is raw prep and tells you nothing about what you are cooking. The
// lettering is dropped so the thumbnail reads as a picture, not dialogue.
function coverUrl(recipe){
  // A purpose-drawn hero shot of the plated dish wins when one exists.
  if(recipe.cover && recipe.cover.url) return apiUrl(recipe.cover.url);

  const comics = (recipe.comics || []).filter(c => c.url || (c.panels || []).length);
  if(comics.length === 0) return null;
  const comic = comics[comics.length - 1];
  const last = Math.max(0, panelCount(comic) - 1);

  const panel = (comic.panels || [])[last];
  if(panel && panel.url) return `${apiUrl(panel.url)}?plain=1`;
  const base = comic.url || "";
  if(!base) return null;
  const abs = /^https?:/i.test(base) ? base : apiUrl(base);
  return `${abs}${abs.includes("?") ? "&" : "?"}panel=${last}&plain=1`;
}

function panelUrl(comic, panelIdx){
  // Newer art is drawn one image per step; older strips are cropped to the
  // requested panel on the way out.
  const panel = (comic.panels || [])[panelIdx];
  if(panel && panel.url) return apiUrl(panel.url);
  const base = comic.url || "";
  const abs = /^https?:/i.test(base) ? base : apiUrl(base);
  return `${abs}${abs.includes("?") ? "&" : "?"}panel=${panelIdx}`;
}

function panelCount(comic){
  if(comic.panels && comic.panels.length) return comic.panels.length;
  if(Array.isArray(comic.stepRange)) return comic.stepRange[1] - comic.stepRange[0] + 1;
  return 1;
}

// The comic is the recipe: one big panel per step, read top to bottom, with
// the instruction lettered into the art itself.
function renderStepDisplay(recipe){
  const comics = (recipe.comics || []).filter(c => Array.isArray(c.stepRange));
  if(comics.length === 0){
    return `<div class="step-list">${recipe.steps.map((s, i) => plainStepRow(recipe, i)).join("")}</div>`;
  }

  const covered = new Set();
  const ordered = [...comics].sort((a, b) => a.stepRange[0] - b.stepRange[0]);
  const blocks = [];
  let cursor = 0;

  for(const comic of ordered){
    const from = Math.max(1, comic.stepRange[0]) - 1;
    const to = Math.min(recipe.steps.length, comic.stepRange[1]) - 1;

    for(let idx = cursor; idx < from; idx++){
      if(!covered.has(idx)){ blocks.push(plainStepRow(recipe, idx)); covered.add(idx); }
    }

    if(ordered.length > 1){
      blocks.push(`<div class="comic-chapter">Part ${comic.index + 1}</div>`);
    }

    const count = panelCount(comic);
    for(let p = 0; p < count; p++){
      const idx = from + p;
      if(idx > to || idx >= recipe.steps.length) break;
      covered.add(idx);
      blocks.push(`<img class="comic-panel" src="${escapeHtml(panelUrl(comic, p))}"
        alt="Step ${idx + 1}: ${escapeHtml(recipe.steps[idx])}" loading="lazy">`);
    }
    cursor = to + 1;
  }

  for(let idx = cursor; idx < recipe.steps.length; idx++){
    if(!covered.has(idx)) blocks.push(plainStepRow(recipe, idx));
  }

  // Long steps are trimmed to fit a speech bubble, so keep the full wording
  // one tap away rather than losing quantities and timings.
  const fullText = `
    <details class="full-steps">
      <summary>Full step text</summary>
      <div class="step-list">${recipe.steps.map((s, i) => plainStepRow(recipe, i)).join("")}</div>
    </details>`;

  return `<div class="comic-book">${blocks.join("")}</div>${fullText}`;
}

// The daily image allowance is spent, so the art will be drawn later. Say so
// plainly rather than leaving the author wondering where the comic went.
function notifyQueued(title){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal">
      <button class="modal-close">&times;</button>
      <h2>Comics queued</h2>
      <div class="rule"></div>
      <div class="notes">
        <b>${escapeHtml(title)}</b> is saved and ready to cook from.<br><br>
        The daily free allowance for drawing has run out, so its comic is in the
        queue. It will be drawn automatically once the allowance resets, and the
        recipe will update on its own - nothing more for you to do.
      </div>
      <div class="modal-actions">
        <button class="btn-primary" id="queued-ok">Got it</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#queued-ok").onclick = close;
  overlay.onclick = e => { if(e.target === overlay) close(); };
}

function showToast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add("show"), 10);
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 2400);
}

// --- recipe view -----------------------------------------------------------

function makeRecipeShareUrl(recipe){
  return `${location.origin}${location.pathname}#recipe=${encodeURIComponent(recipe.id)}`;
}

async function shareRecipe(recipe){
  const url = makeRecipeShareUrl(recipe);
  if(navigator.share){
    try{ await navigator.share({title:recipe.title, url}); return; }catch(e){ if(e.name === "AbortError") return; }
  }
  await navigator.clipboard.writeText(url);
  showToast("Share link copied");
}

function openView(id){
  const r = recipes.find(x => x.id === id);
  if(!r) return;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal">
      <button class="modal-close">&times;</button>
      <div class="modal-icon">${CAT_ICON[r.category] || "⭐"}</div>
      <h2>${escapeHtml(r.title)}</h2>
      <div class="rule"></div>
      <div class="field-label">Ingredients</div>
      <div class="ing-grid">${r.ingredients.map(i => `<div class="ing-chip"><span class="ing-emoji">${guessIcon(i)}</span>${escapeHtml(i)}</div>`).join("")}</div>
      <div class="field-label">Steps</div>
      ${renderStepDisplay(r)}
      ${r.notes ? `<div class="notes">${escapeHtml(r.notes)}</div>` : ""}
      <div class="footer-row">
        <span>${r.servings ? "Serves " + escapeHtml(r.servings) : ""}</span>
        <span>${r.contributor ? "From " + escapeHtml(r.contributor) : ""}</span>
      </div>
      <div class="modal-actions">
        <button class="btn-primary btn-small" id="shareBtn">Share</button>
        <button class="btn-ghost btn-small" id="editBtn">Edit</button>
        <button class="btn-ai btn-small" id="redrawBtn">${(r.comics || []).length ? "Redraw Comics" : "Draw Comics"}</button>
        <button class="btn-danger btn-small" id="delBtn">Delete</button>
      </div>
      <div id="view-status"></div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector(".modal-close").onclick = () => overlay.remove();
  overlay.onclick = e => { if(e.target === overlay) overlay.remove(); };
  overlay.querySelector("#shareBtn").onclick = () => shareRecipe(r);
  overlay.querySelector("#editBtn").onclick = () => { overlay.remove(); openForm(r); };

  const redrawBtn = overlay.querySelector("#redrawBtn");
  const viewStatus = overlay.querySelector("#view-status");
  redrawBtn.onclick = async () => {
    redrawBtn.disabled = true;
    viewStatus.innerHTML = `<div class="status-line">Drawing comics... this takes up to a minute.</div>`;
    try{
      await api(`/api/recipes/${encodeURIComponent(r.id)}/comics`, {method:"POST"});
      await loadRecipes(true);
      overlay.remove();
      showToast("Comics drawn");
      openView(r.id);
    }catch(e){
      redrawBtn.disabled = false;
      viewStatus.innerHTML = `<div class="error-msg">Could not draw comics: ${escapeHtml(e.message)}</div>`;
    }
  };

  const delBtn = overlay.querySelector("#delBtn");
  delBtn.onclick = () => {
    delBtn.outerHTML = `<span class="confirm-row">Delete for good? <button class="btn-danger btn-small" id="delYes">Yes, delete</button> <button class="btn-ghost btn-small" id="delNo">Cancel</button></span>`;
    overlay.querySelector("#delNo").onclick = () => { overlay.remove(); openView(r.id); };
    overlay.querySelector("#delYes").onclick = async () => {
      try{
        await api(`/api/recipes/${encodeURIComponent(r.id)}`, {method:"DELETE"});
        await loadRecipes(true);
        overlay.remove();
        showToast(`Deleted "${r.title}"`);
      }catch(e){
        lastError = "Could not delete recipe (" + e.message + ").";
        render();
      }
    };
  };
}

// --- add / edit ------------------------------------------------------------

function openForm(existing, prefill){
  const data = existing || prefill || {title:"", category:"Mains", servings:"", contributor:"", ingredients:[], steps:[], notes:""};
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal wide">
      <button class="modal-close">&times;</button>
      <h2>${existing ? "Edit Recipe" : "New Recipe"}</h2>
      <div class="rule"></div>
      <label>Title</label>
      <input type="text" id="f-title" value="${escapeHtml(data.title)}" placeholder="e.g. Grandma's Sunday Sauce">
      <div class="row2">
        <div>
          <label>Category</label>
          <select id="f-cat">${CATEGORIES.map(c => `<option ${data.category === c ? "selected" : ""}>${c}</option>`).join("")}</select>
        </div>
        <div>
          <label>Servings</label>
          <input type="text" id="f-servings" value="${escapeHtml(data.servings)}" placeholder="e.g. 4-6">
        </div>
      </div>
      <label>Added by</label>
      <input type="text" id="f-contributor" value="${escapeHtml(data.contributor)}" placeholder="e.g. Aunt Rosa">
      <label>Ingredients <span class="hint">- one per line</span></label>
      <textarea id="f-ingredients" rows="6">${escapeHtml((data.ingredients || []).join("\n"))}</textarea>
      <label>Steps <span class="hint">- one per line</span></label>
      <textarea id="f-steps" rows="6">${escapeHtml((data.steps || []).join("\n"))}</textarea>
      <label>Notes <span class="hint">- optional</span></label>
      <textarea id="f-notes" rows="2">${escapeHtml(data.notes || "")}</textarea>
      <div class="tool-box" style="margin-top:16px;">
        <div class="confirm-row">
          <input type="checkbox" id="f-comics" ${existing && (existing.comics || []).length ? "" : "checked"} style="width:auto;">
          <label for="f-comics" style="margin:0;">Draw comic strips for the steps</label>
        </div>
        <div class="hint">Steps are capped at 12 and split into 1-4 strips of about 3 panels. Drawing takes up to a minute.</div>
      </div>
      <div class="modal-actions">
        <button class="btn-primary" id="saveBtn">Save Recipe</button>
        <button class="btn-ghost" id="cancelBtn">Cancel</button>
      </div>
      <div id="form-status"></div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector(".modal-close").onclick = () => overlay.remove();
  overlay.querySelector("#cancelBtn").onclick = () => overlay.remove();
  overlay.querySelector("#saveBtn").onclick = async () => {
    const titleField = overlay.querySelector("#f-title");
    const saveBtn = overlay.querySelector("#saveBtn");
    const statusEl = overlay.querySelector("#form-status");
    const title = titleField.value.trim();
    let titleErr = overlay.querySelector("#title-err");
    if(!title){
      if(!titleErr){
        titleErr = document.createElement("div");
        titleErr.id = "title-err";
        titleErr.className = "error-msg";
        titleErr.textContent = "Please give the recipe a title.";
        titleField.insertAdjacentElement("afterend", titleErr);
      }
      titleField.focus();
      return;
    }
    if(titleErr) titleErr.remove();

    const generateComics = overlay.querySelector("#f-comics").checked;
    const payload = {
      title,
      category:overlay.querySelector("#f-cat").value,
      servings:overlay.querySelector("#f-servings").value.trim(),
      contributor:overlay.querySelector("#f-contributor").value.trim(),
      ingredients:overlay.querySelector("#f-ingredients").value.split("\n").map(s => s.trim()).filter(Boolean),
      steps:overlay.querySelector("#f-steps").value.split("\n").map(s => s.trim()).filter(Boolean),
      notes:overlay.querySelector("#f-notes").value.trim(),
      generateComics
    };

    try{
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";
      statusEl.innerHTML = `<div class="status-line">${generateComics ? "Saving and drawing comics... this takes up to a minute." : "Saving..."}</div>`;
      const result = existing
        ? await api(`/api/recipes/${encodeURIComponent(existing.id)}`, {method:"PUT", body:JSON.stringify(payload)})
        : await api("/api/recipes", {method:"POST", body:JSON.stringify(payload)});
      await loadRecipes(true);
      overlay.remove();
      if(result.plan && result.plan.queued){
        showToast(`Saved "${title}" - comics queued`);
        notifyQueued(title);
      }else{
        showToast(`Saved "${title}"`);
      }
    }catch(e){
      saveBtn.disabled = false;
      saveBtn.textContent = "Save Recipe";
      statusEl.innerHTML = `<div class="error-msg">Could not save: ${escapeHtml(e.message)}</div>`;
    }
  };
}

// --- paste / import --------------------------------------------------------

function parseRecipeTextLocally(raw){
  const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const recipe = {title:lines[0] || "Untitled Recipe", category:"Other", servings:"", contributor:"", ingredients:[], steps:[], notes:""};
  let section = "ingredients";
  for(const line of lines.slice(1)){
    const lower = line.toLowerCase().replace(/:$/, "");
    if(CATEGORIES.map(c => c.toLowerCase()).includes(lower)){ recipe.category = CATEGORIES.find(c => c.toLowerCase() === lower); continue; }
    if(/^serv(es|ings?)\b/i.test(line)){ recipe.servings = line.replace(/^serv(es|ings?)\s*:?\s*/i, ""); continue; }
    if(/^from\b|^by\b/i.test(line)){ recipe.contributor = line.replace(/^(from|by)\s*:?\s*/i, ""); continue; }
    if(/ingredient/i.test(lower)){ section = "ingredients"; continue; }
    if(/instruction|direction|method|step/i.test(lower)){ section = "steps"; continue; }
    if(/note/i.test(lower)){ section = "notes"; continue; }
    const cleaned = line.replace(/^[-*•]\s*/, "").replace(/^\d+[.)]\s*/, "");
    if(section === "steps") recipe.steps.push(cleaned);
    else if(section === "notes") recipe.notes += (recipe.notes ? " " : "") + cleaned;
    else recipe.ingredients.push(cleaned);
  }
  return recipe;
}

// Smart Add: paste anything that contains a recipe and let the model work out
// the title, ingredients and ordered steps. The local parser below is only a
// fallback for when the service cannot be reached.
function openSmartAdd(){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal wide">
      <button class="modal-close">&times;</button>
      <h2>✨ Smart Add</h2>
      <div class="rule"></div>
      <div class="tool-box">
        <label style="margin-top:0">Paste anything with a recipe in it</label>
        <textarea id="smart-input" rows="12" placeholder="A text from your mum, a screenshot transcript, a blog ramble, scribbled notes, another language - any format. The AI works out the title, ingredients and steps."></textarea>
        <button class="btn-ai" id="smart-run" style="margin-top:12px;width:100%;">Turn it into a recipe</button>
        <div class="hint">You get to check and edit the result before anything is saved. Comics are drawn when you save.</div>
        <div id="smart-status"></div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const input = overlay.querySelector("#smart-input");
  const runBtn = overlay.querySelector("#smart-run");
  const status = overlay.querySelector("#smart-status");

  overlay.querySelector(".modal-close").onclick = () => overlay.remove();
  runBtn.onclick = async () => {
    const text = input.value.trim();
    if(!text){
      status.innerHTML = `<div class="error-msg">Paste something first.</div>`;
      return;
    }
    runBtn.disabled = true;
    runBtn.textContent = "Reading it...";
    status.innerHTML = `<div class="status-line">Working out the ingredients and steps...</div>`;
    try{
      const result = await api("/api/parse", {method:"POST", body:JSON.stringify({text})});
      const parsed = result.recipe;
      overlay.remove();
      showToast(`Found "${parsed.title}"`);
      openForm(null, {
        ...parsed,
        steps: (parsed.steps || []).map(step => step.text),
        stepTitles: (parsed.steps || []).map(step => step.title)
      });
    }catch(e){
      runBtn.disabled = false;
      runBtn.textContent = "Turn it into a recipe";
      // Fall back to the local parser so a paste is never simply lost.
      const local = parseRecipeTextLocally(text);
      status.innerHTML = `<div class="error-msg">AI parsing failed: ${escapeHtml(e.message)}</div>
        <div class="status-line">Opening a rough local parse instead - check it carefully.</div>`;
      setTimeout(() => { overlay.remove(); openForm(null, local); }, 2200);
    }
  };
}

// --- settings --------------------------------------------------------------

function openSharedRecipeFromHash(){
  const match = /#recipe=([^&]+)/.exec(location.hash);
  if(!match) return;
  const id = decodeURIComponent(match[1]);
  history.replaceState(null, "", location.pathname);
  const tryOpen = () => {
    if(recipes.find(r => r.id === id)) openView(id);
    else setTimeout(tryOpen, 400);
  };
  setTimeout(tryOpen, 400);
}

// Escape closes whatever is on top. The form guards against losing a
// half-typed recipe to a stray keypress.
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  const overlays = document.querySelectorAll(".overlay");
  const top = overlays[overlays.length - 1];
  if(!top) return;
  const dirty = Array.from(top.querySelectorAll("input[type=text], textarea"))
    .some(field => field.value.trim());
  if(dirty && !confirm("Close without saving?")) return;
  top.remove();
});

document.getElementById("search").addEventListener("input", e => { searchTerm = e.target.value; render(); });
document.getElementById("btnAdd").onclick = () => openForm(null);
document.getElementById("btnFormat").onclick = openSmartAdd;

loadRecipes();
openSharedRecipeFromHash();
startBackgroundRefresh();
</script>
