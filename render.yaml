# Render Blueprint for The Family Recipe Box.
# One free web service serves both the static recipe box and the Groq-backed
# comic API, so the browser talks to a same-origin backend.
services:
  - type: web
    name: family-recipe-box
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      # OpenRouter runs both the panel scripts and the painting.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_TEXT_MODEL
        value: google/gemini-2.5-flash
      - key: OPENROUTER_IMAGE_MODEL
        value: google/gemini-3.1-flash-image
      - key: IMAGE_PROVIDER
        value: auto
      # Recipes and comic art live here - free web services have no disk.
      - key: DATABASE_URL
        fromDatabase:
          name: family-recipe-box-db
          property: connectionString

databases:
  - name: family-recipe-box-db
    plan: free
    region: oregon
    databaseName: recipebox
    user: recipebox
