<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Family Recipe Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF4DC;
    --paper-raised:#FFFFFF;
    --ink:#171512;
    --ink-soft:#4A453D;
    --rule-red:#EE3E36;
    --sage:#2F6FED;
    --sage-deep:#1E4FB8;
    --butter:#FFCC29;
    --line:#171512;
    --pop:#3FB84F;
    --shadow:4px 4px 0 var(--ink);
    --shadow-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Comic Neue', sans-serif;
    font-weight:700;
    background-image:radial-gradient(circle, rgba(23,21,18,0.14) 1.6px, transparent 1.6px);
    background-size:16px 16px;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
  .header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;border-bottom:5px solid var(--ink);padding-bottom:18px;margin-bottom:26px;}
  .header h1{font-family:'Bangers', cursive;font-weight:400;font-size:56px;margin:0;letter-spacing:.02em;color:var(--rule-red);text-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg);}
  .header .sub{font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-top:8px;}
  .err-banner{color:var(--rule-red);text-transform:none;letter-spacing:0;}
  .header-actions{display:flex;gap:10px;flex-wrap:wrap;}
  button{font-family:'Bangers', cursive;letter-spacing:.03em;cursor:pointer;border:3px solid var(--ink);border-radius:8px;font-size:16px;font-weight:400;padding:10px 18px;box-shadow:var(--shadow-sm);transition:transform .1s ease, box-shadow .1s ease;}
  button:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);}
  button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);}
  button:disabled{opacity:.55;cursor:not-allowed;transform:none;}
  .btn-primary{background:var(--sage);color:#fff;}
  .btn-ai{background:var(--butter);color:var(--ink);}
  .btn-ghost{background:var(--paper-raised);color:var(--ink);}
  .btn-danger{background:var(--rule-red);color:#fff;}
  .btn-small{padding:7px 12px;font-size:13px;}
  .layout{display:flex;gap:26px;align-items:flex-start;}
  .tabs{display:flex;flex-direction:column;gap:8px;min-width:140px;position:sticky;top:20px;}
  .tab{font-family:'Bangers', cursive;letter-spacing:.03em;font-size:15px;text-transform:uppercase;padding:9px 12px;border:3px solid var(--ink);background:var(--paper-raised);cursor:pointer;color:var(--ink-soft);border-radius:8px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s ease;}
  .tab:hover{transform:translate(-1px,-1px);}
  .tab.active{background:var(--rule-red);color:#fff;}
  .tab .count{opacity:.75;margin-left:3px;}
  .tab-icon{font-size:20px;vertical-align:middle;}
  .main{flex:1;min-width:0;}
  .search-row{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:18px;}
  .search{width:100%;padding:11px 14px;border:3px solid var(--ink);border-radius:8px;font-family:'Comic Neue';font-weight:700;font-size:14px;background:var(--paper-raised);box-shadow:var(--shadow-sm);}
  .search:focus{outline:none;border-color:var(--sage);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(230px,1fr));gap:22px;}
  .card{background:var(--paper-raised);border:3px solid var(--ink);border-radius:10px;box-shadow:var(--shadow);padding:20px 16px 16px;position:relative;cursor:pointer;display:flex;flex-direction:column;min-height:155px;transition:transform .12s ease, box-shadow .12s ease;}
  .card:hover{transform:translate(-3px,-3px) rotate(-0.6deg);box-shadow:7px 7px 0 var(--ink);}
  .card-icon{font-size:44px;line-height:1;margin-bottom:8px;transform:rotate(-3deg);}
  .card h3{font-family:'Bangers', cursive;font-weight:400;font-size:22px;margin:0;line-height:1.15;letter-spacing:.02em;}
  .card .meta{margin-top:auto;padding-top:12px;font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;}
  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty b{display:block;font-family:'Bangers';font-weight:400;font-size:30px;color:var(--rule-red);margin-bottom:8px;letter-spacing:.03em;}
  .overlay{position:fixed;inset:0;background:rgba(23,21,18,0.6);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;}
  .modal{background:var(--paper-raised);width:100%;max-width:560px;max-height:86vh;overflow-y:auto;border-radius:12px;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:26px 28px 24px;position:relative;}
  .modal.wide{max-width:720px;}
  .modal-close{position:absolute;top:12px;right:14px;background:var(--rule-red);color:#fff;border:2.5px solid var(--ink);border-radius:50%;width:30px;height:30px;font-size:18px;line-height:1;padding:0;box-shadow:2px 2px 0 var(--ink);}
  .modal h2{font-family:'Bangers', cursive;font-weight:400;font-size:32px;margin:0 0 6px;padding-right:20px;letter-spacing:.02em;}
  .modal .rule{height:4px;background:var(--rule-red);margin:14px 0;border-radius:2px;}
  .modal .field-label{font-family:'Bangers', cursive;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--sage-deep);margin:16px 0 8px;}
  .modal-icon{font-size:56px;line-height:1;transform:rotate(-3deg);}
  .ing-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .ing-chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;padding:6px 12px;font-size:13px;box-shadow:2px 2px 0 var(--ink);}
  .ing-emoji{font-size:18px;}
  .step-list{display:flex;flex-direction:column;gap:10px;}
  .step-row{display:flex;align-items:flex-start;gap:10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;padding:9px 12px;font-size:13.5px;box-shadow:2px 2px 0 var(--ink);}
  .step-num{flex-shrink:0;background:var(--rule-red);color:#fff;border:2px solid var(--ink);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-family:'Bangers';font-size:14px;}
  .step-emoji{font-size:18px;flex-shrink:0;}
  .step-card{background:#f8f2e2;border:3px solid var(--ink);border-radius:22px;padding:18px;box-shadow:var(--shadow-sm);}
  .step-header{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
  .step-number-big{width:48px;height:48px;background:var(--rule-red);border:3px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Bangers';font-size:24px;flex-shrink:0;}
  .step-title{font-family:'Bangers';font-size:23px;line-height:1.1;letter-spacing:.02em;color:var(--ink);}
  .step-caption{font-size:13.5px;line-height:1.45;color:var(--ink-soft);margin:0 0 12px 66px;}
  .step-card img{display:block;width:100%;border:3px solid var(--ink);border-radius:12px;background:#fff;}
  .comic-strip{background:var(--paper-raised);border:3px solid var(--ink);border-radius:14px;box-shadow:var(--shadow-sm);padding:12px;margin-bottom:16px;}
  .comic-strip-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .comic-badge{font-family:'Bangers';font-size:14px;letter-spacing:.03em;background:var(--butter);border:2.5px solid var(--ink);border-radius:20px;padding:2px 12px;box-shadow:2px 2px 0 var(--ink);}
  .comic-strip img{display:block;width:100%;border:3px solid var(--ink);border-radius:10px;background:#fff;}
  .comic-captions{display:grid;gap:8px;margin-top:12px;}
  .comic-caption{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.45;color:var(--ink);}
  .comic-caption .step-num{margin-top:1px;}
  .comic-caption b{font-family:'Bangers';font-weight:400;font-size:15px;letter-spacing:.02em;display:block;}
  .comic-caption span.txt{color:var(--ink-soft);}
  .gen-steps{display:grid;gap:6px;margin-top:10px;}
  .gen-step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);font-family:'Comic Neue';letter-spacing:0;text-transform:none;}
  .gen-step .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);flex-shrink:0;}
  .gen-step.done .dot{background:var(--pop);}
  .gen-step.active .dot{background:var(--butter);}
  .gen-step.failed .dot{background:var(--rule-red);}
  .modal .notes{color:var(--ink);font-size:13.5px;line-height:1.5;background:#FFF0B8;border:2px dashed var(--ink);padding:10px 12px;border-radius:8px;margin-top:14px;}
  .modal .footer-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px;font-size:12.5px;color:var(--ink-soft);}
  .modal-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .confirm-row{display:flex;align-items:center;gap:8px;font-size:13.5px;flex-wrap:wrap;}
  label{display:block;font-family:'Bangers', cursive;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text], select, textarea{width:100%;padding:9px 11px;border:2.5px solid var(--ink);border-radius:6px;font-family:'Comic Neue';font-weight:700;font-size:14px;background:#fff;color:var(--ink);}
  textarea{font-size:13.5px;line-height:1.6;resize:vertical;}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--sage);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;text-transform:none;font-family:'Comic Neue';letter-spacing:0;}
  .tool-box{background:#FFF0B8;border:3px dashed var(--ink);border-radius:10px;padding:16px;margin-bottom:6px;}
  .share-link{word-break:break-all;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:10px;font-size:12px;margin-top:10px;}
  .status-line{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.45;}
  .sync-pill{display:inline-block;background:var(--paper-raised);border:2px solid var(--ink);border-radius:20px;padding:3px 9px;margin-left:6px;color:var(--ink);}
  .error-msg{color:var(--rule-red);font-size:13px;font-weight:700;margin-top:8px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--pop);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:12px 20px;font-family:'Bangers';font-size:16px;letter-spacing:.02em;box-shadow:4px 4px 0 var(--ink);opacity:0;transition:opacity .25s ease, transform .25s ease;z-index:100;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (max-width:760px){
    .layout{flex-direction:column;}
    .tabs{flex-direction:row;flex-wrap:wrap;position:static;width:100%;min-width:0;}
    .header h1{font-size:40px;}
    .search-row{grid-template-columns:1fr;}
    .row2{grid-template-columns:1fr;}
    .modal{padding:24px 18px 20px;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div>
      <h1>The Family Recipe Box</h1>
      <div class="sub" id="subcount">loading recipes...</div>
    </div>
    <div class="header-actions">
      <button class="btn-ai" id="btnFormat">Format Paste</button>
      <button class="btn-ghost" id="btnJsonFormat">JSON Format</button>
      <button class="btn-ghost" id="btnAddJson">Add JSON</button>
      <button class="btn-ghost" id="btnImport">Import</button>
      <button class="btn-ghost" id="btnSync">Sync</button>
      <button class="btn-ghost" id="btnSettings">GitHub</button>
      <button class="btn-primary" id="btnAdd">+ Add Recipe</button>
    </div>
  </div>

  <div class="layout">
    <div class="tabs" id="tabs"></div>
    <main class="main">
      <div class="search-row">
        <input class="search" id="search" type="text" placeholder="Search recipes by name...">
        <button class="btn-ghost" id="btnExport">Export View</button>
      </div>
      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>

<script>
const CATEGORIES = ["Breakfast","Mains","Sides","Desserts","Drinks","Snacks","Other"];
const CAT_ICON = {Breakfast:"🍳",Mains:"🍝",Sides:"🥗",Desserts:"🍰",Drinks:"🥤",Snacks:"🍿",Other:"⭐"};
const GITHUB_OWNER = "farag4m";
const GITHUB_REPO = "RecipeBook";
const DATA_BRANCH = "data";
const POLL_MS = 15000;
const TOKEN_KEY = "family-recipe-box:github-token";
const USER_KEY = "family-recipe-box:github-user";
const COMIC_API_KEY = "family-recipe-box:comic-api";
const COMIC_DIR = "comics";

// The comic service runs on Render. When the site is served by that same
// service the origin is already correct, so only a GitHub Pages visit needs
// the absolute URL. Override per-browser from the Comic Service settings.
const DEFAULT_COMIC_API = "https://family-recipe-box.onrender.com";
function comicApiBase(){
  const stored = (localStorage.getItem(COMIC_API_KEY) || "").trim();
  if(stored) return stored.replace(/\/+$/, "");
  if(location.protocol === "http:" || location.protocol === "https:"){
    if(!/github\.io$/i.test(location.hostname)) return location.origin;
  }
  return DEFAULT_COMIC_API;
}

let recipes = [];
let activeCat = "All";
let searchTerm = "";
let lastError = "";
let syncTimer = null;
let syncInFlight = false;
let lastSyncAt = null;
let githubToken = sessionStorage.getItem(TOKEN_KEY) || "";
let githubUser = sessionStorage.getItem(USER_KEY) || "";

const grid = document.getElementById("grid");
const tabsEl = document.getElementById("tabs");
const subcount = document.getElementById("subcount");

function uid(){ return "r" + Date.now() + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ return String(s || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function slugify(s){
  return String(s || "recipe").toLowerCase().trim()
    .replace(/['"]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 70) || "recipe";
}

function ingredientText(item){
  if(typeof item === "string") return item.trim();
  if(!item || typeof item !== "object") return "";
  if(item.text) return String(item.text).trim();
  const parts = [item.quantity, item.unit, item.name || item.ingredient].map(value => String(value || "").trim()).filter(Boolean);
  const note = String(item.note || item.notes || "").trim();
  return (parts.join(" ") + (note ? ` (${note})` : "")).trim();
}

function stepText(item){
  if(typeof item === "string") return item.trim();
  if(!item || typeof item !== "object") return "";
  return String(item.text || item.instruction || item.description || item.title || "").trim();
}

function stepTitle(item){
  if(typeof item === "string") return item.trim();
  if(!item || typeof item !== "object") return "";
  return String(item.title || item.name || item.text || item.instruction || item.description || "").trim();
}

// A comic strip covers a run of consecutive steps and carries one panel
// caption per step it illustrates.
function normalizeComicRef(comic, idx){
  if(!comic || typeof comic !== "object") return null;
  const path = String(comic.path || comic.src || comic.url || "").trim();
  if(!path) return null;
  const range = Array.isArray(comic.stepRange) ? comic.stepRange.map(Number) : [];
  const panels = (Array.isArray(comic.panels) ? comic.panels : [])
    .map((panel, panelIdx) => ({
      stepIndex:Number.isInteger(panel?.stepIndex) ? panel.stepIndex : panelIdx,
      caption:String(panel?.caption || "").trim()
    }))
    .filter(panel => panel.caption);
  return {
    path,
    name:String(comic.name || `Comic ${idx + 1}`).trim(),
    stepRange:range.length === 2 && range.every(Number.isFinite) ? range : null,
    panels
  };
}

function normalizeComics(raw){
  return (Array.isArray(raw) ? raw : [])
    .map(normalizeComicRef)
    .filter(Boolean)
    .map((comic, idx) => ({...comic, index:idx}));
}

function ingredientStepEntries(item){
  if(!item || typeof item !== "object") return [];
  const source = item.step || item.steps;
  const rawSteps = Array.isArray(source) ? source : (source ? [source] : []);
  return rawSteps.map(rawStep => ({rawStep}));
}

function recipeStepEntries(rawIngredients, rawSteps){
  const ingredientEntries = rawIngredients.flatMap(ingredientStepEntries);
  const topLevelEntries = rawSteps.map(rawStep => ({rawStep}));
  return [...ingredientEntries, ...topLevelEntries];
}

function normalizeRecipe(r){
  const rawIngredients = Array.isArray(r.ingredients) ? r.ingredients : [];
  const rawSteps = Array.isArray(r.steps) ? r.steps : [];
  const rawStepTitles = Array.isArray(r.stepTitles) ? r.stepTitles : [];
  const entries = recipeStepEntries(rawIngredients, rawSteps)
    .map(entry => ({...entry, text:stepText(entry.rawStep)}))
    .filter(entry => entry.text);
  const stepTitles = entries.map((entry, idx) => String(rawStepTitles[idx] || stepTitle(entry.rawStep) || stepText(entry.rawStep)).trim());
  return {
    id:r.id || uid(),
    title:String(r.title || "Untitled Recipe").trim() || "Untitled Recipe",
    category:CATEGORIES.includes(r.category) ? r.category : "Other",
    servings:String(r.servings || "").trim(),
    contributor:String(r.contributor || r.author || "").trim(),
    ingredients:rawIngredients.map(ingredientText).filter(Boolean),
    steps:entries.map(entry => entry.text),
    stepTitles,
    notes:String(r.notes || "").trim(),
    slug:slugify(r.slug || r.title || "recipe"),
    author:String(r.author || r.contributor || "").trim(),
    updatedAt:r.updatedAt || "",
    comics:normalizeComics(r.comics)
  };
}

function withMeta(recipe, meta){
  return Object.assign(normalizeRecipe(recipe), meta);
}

function recipeForStorage(recipe){
  const r = normalizeRecipe(recipe);
  return {
    format:"family-recipe-box.recipe.v1",
    id:r.id,
    slug:r.slug,
    title:r.title,
    category:r.category,
    servings:r.servings,
    contributor:r.contributor,
    author:r.author || githubUser || r.contributor,
    ingredients:r.ingredients.map((text, idx) => {
      const ingredient = {text};
      const stepTextValue = r.steps[idx];
      if(stepTextValue){
        ingredient.step = {
          title:r.stepTitles[idx] || stepTextValue,
          text:stepTextValue
        };
      }
      return ingredient;
    }),
    steps:r.steps.slice(r.ingredients.length).map((text, offset) => {
      const idx = r.ingredients.length + offset;
      return {
        title:r.stepTitles[idx] || text,
        text
      };
    }),
    comics:r.comics.map(comic => ({
      path:comic.path,
      name:comic.name,
      stepRange:comic.stepRange,
      panels:comic.panels
    })),
    notes:r.notes,
    updatedAt:new Date().toISOString()
  };
}

function githubHeaders(auth){
  const headers = {
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"
  };
  if(auth && githubToken) headers.Authorization = `Bearer ${githubToken}`;
  return headers;
}

async function githubApi(path, options = {}, auth = false){
  const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/${path}`, {
    cache:"no-store",
    ...options,
    headers:{...githubHeaders(auth), ...(options.headers || {})}
  });
  if(!res.ok){
    const text = await res.text();
    let message = `GitHub API ${res.status}`;
    try{ message = JSON.parse(text).message || message; }catch(e){}
    const err = new Error(message);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

function rawUrl(path){
  const encodedPath = String(path).split("/").map(encodeURIComponent).join("/");
  return `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${DATA_BRANCH}/${encodedPath}?v=${Date.now()}`;
}

async function loadRecipes(silent = false){
  if(syncInFlight) return;
  syncInFlight = true;
  if(!silent) subcount.textContent = "syncing recipes...";
  try{
    const tree = await githubApi(`git/trees/${encodeURIComponent(DATA_BRANCH)}?recursive=1`, {}, Boolean(githubToken));
    const entries = tree.tree || [];
    const files = entries.filter(item =>
      item.type === "blob" &&
      /^users\/[^/]+\/recipes\/[^/]+\.json$/.test(item.path)
    );
    const loaded = await Promise.all(files.map(async item => {
      const res = await fetch(rawUrl(item.path), {cache:"no-store"});
      if(!res.ok) throw new Error(`Could not read ${item.path}`);
      const parsed = await res.json();
      const owner = item.path.split("/")[1];
      const slug = item.path.split("/").pop().replace(/\.json$/, "");
      return withMeta(parsed, {_path:item.path, _sha:item.sha, _owner:owner, _slug:slug});
    }));
    recipes = loaded.sort((a,b) => a.title.localeCompare(b.title));
    lastError = "";
    lastSyncAt = new Date();
  }catch(e){
    if(e.status === 404){
      recipes = [];
      lastError = "";
      lastSyncAt = new Date();
    }else{
      lastError = "Could not sync GitHub recipes (" + (e.message || "network error") + ").";
    }
  }finally{
    syncInFlight = false;
    render();
  }
}

// Generated strips arrive as base64 from the comic service and are committed
// to the data branch so recipes keep working as plain static JSON + PNG.
async function uploadComicImage(path, base64Png, message){
  const sha = await getFileSha(path);
  const body = {
    message,
    content:base64Png,
    branch:DATA_BRANCH
  };
  if(sha) body.sha = sha;
  await githubApi(`contents/${encodeURIComponent(path).replace(/%2F/g, "/")}`, {
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  }, true);
  return path;
}

function requireGithubWrite(){
  if(githubToken && githubUser) return true;
  openGithubSettings();
  showToast("Add GitHub access first");
  return false;
}

function bytesToBase64(bytes){
  let binary = "";
  const chunk = 0x8000;
  for(let i = 0; i < bytes.length; i += chunk){
    binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

function encodeJson(obj){
  return bytesToBase64(new TextEncoder().encode(JSON.stringify(obj, null, 2)));
}

function recipePathFor(recipe, existing){
  if(existing && existing._path) return existing._path;
  return `users/${githubUser}/recipes/${slugify(recipe.slug || recipe.title)}.json`;
}

async function getFileSha(path){
  try{
    const data = await githubApi(`contents/${encodeURIComponent(path).replace(/%2F/g, "/")}?ref=${encodeURIComponent(DATA_BRANCH)}`, {}, true);
    return data.sha || null;
  }catch(e){
    if(e.status === 404) return null;
    throw e;
  }
}

async function saveRecipeToGithub(recipe, existing){
  if(!requireGithubWrite()) return false;
  const stored = recipeForStorage({...recipe, author:recipe.author || githubUser});
  const path = recipePathFor(stored, existing);
  const sha = await getFileSha(path);
  const body = {
    message:`Save recipe: ${stored.title}`,
    content:encodeJson(stored),
    branch:DATA_BRANCH
  };
  if(sha) body.sha = sha;
  await githubApi(`contents/${encodeURIComponent(path).replace(/%2F/g, "/")}`, {
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  }, true);
  await loadRecipes(true);
  return true;
}

async function deleteRecipeFromGithub(recipe){
  if(!requireGithubWrite()) return false;
  if(!recipe._path) return false;
  const sha = await getFileSha(recipe._path);
  if(!sha) return false;
  await githubApi(`contents/${encodeURIComponent(recipe._path).replace(/%2F/g, "/")}`, {
    method:"DELETE",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      message:`Delete recipe: ${recipe.title}`,
      sha,
      branch:DATA_BRANCH
    })
  }, true);
  await loadRecipes(true);
  return true;
}

function githubPermissionHint(message){
  if(/resource not accessible by personal access token/i.test(message || "")){

// --- Comic generation ------------------------------------------------------
// Steps are sent to the Groq-backed comic service, which caps the recipe at
// 12 steps, splits it into 1-4 strips of about 3 steps, and paints one comic
// page per strip. The returned images are committed to the data branch.

const COMIC_TIMEOUT_MS = 300000;

function comicPathFor(recipe, index){
  return `${COMIC_DIR}/${slugify(recipe.slug || recipe.title)}/strip-${index + 1}.png`;
}

// The service may return PNG, JPEG or an SVG storyboard; GitHub-hosted images
// are always stored as PNG so raw.githubusercontent serves them inline.
function toPngBase64(mime, base64){
  return new Promise((resolve, reject) => {
    if(/png/i.test(mime)) return resolve(base64);
    const img = new Image();
    img.onload = () => {
      try{
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth || img.width || 1440;
        canvas.height = img.naturalHeight || img.height || 576;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#F6EDDA";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/png").split(",")[1]);
      }catch(e){ reject(e); }
    };
    img.onerror = () => reject(new Error("Could not read the generated image"));
    img.src = `data:${mime};base64,${base64}`;
  });
}

async function comicServiceHealth(){
  const res = await fetch(`${comicApiBase()}/api/health`, {cache:"no-store"});
  if(!res.ok) throw new Error(`Comic service ${res.status}`);
  return res.json();
}

async function requestComics(recipe){
  const res = await fetch(`${comicApiBase()}/api/comics`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      title:recipe.title,
      category:recipe.category,
      servings:recipe.servings,
      ingredients:recipe.ingredients,
      steps:recipe.steps.map((text, idx) => ({
        title:(recipe.stepTitles && recipe.stepTitles[idx]) || "",
        text
      }))
    }),
    signal:AbortSignal.timeout(COMIC_TIMEOUT_MS)
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok || !data.ok) throw new Error(data.error || `Comic service ${res.status}`);
  return data;
}

// Generates strips, commits the PNGs, and returns the recipe with comic refs.
// A failure here never blocks the save - the recipe is stored without comics.
async function generateRecipeComics(recipe, report = () => {}){
  if(recipe.steps.length === 0) return {...recipe, comics:[]};

  report("Asking the comic service for a storyboard...");
  const result = await requestComics(recipe);

  const plan = result.plan || {};
  report(
    `Drawing ${plan.chunkCount} comic${plan.chunkCount === 1 ? "" : "s"} ` +
    `from ${plan.usedSteps} step${plan.usedSteps === 1 ? "" : "s"}` +
    (plan.condensed ? ` (condensed from ${plan.submittedSteps})` : "") + "..."
  );

  const comics = [];
  for(const comic of result.comics){
    report(`Saving comic ${comic.index + 1} of ${result.comics.length}...`);
    const png = await toPngBase64(comic.image.mime, comic.image.base64);
    const path = comicPathFor(recipe, comic.index);
    await uploadComicImage(path, png, `Comic ${comic.index + 1} for ${recipe.title}`);
    comics.push({
      path,
      name:`${recipe.title} - part ${comic.index + 1}`,
      stepRange:comic.stepRange,
      panels:comic.panels.map(panel => ({stepIndex:panel.stepIndex, caption:panel.caption}))
    });
  }

  // The service may have condensed an oversized recipe; keep what it drew.
  const steps = Array.isArray(result.steps) && result.steps.length
    ? result.steps
    : recipe.steps.map(text => ({title:"", text}));

  return {
    ...recipe,
    steps:steps.map(step => step.text),
    stepTitles:steps.map((step, idx) => step.title || recipe.stepTitles[idx] || step.text),
    comics:normalizeComics(comics)
  };
}

function plainStepRow(recipe, idx){
  const step = recipe.steps[idx];
  if(!step) return "";
  return `<div class="step-row"><span class="step-num">${idx + 1}</span><span class="step-emoji">${guessStepIcon(step)}</span><span>${escapeHtml(step)}</span></div>`;
}

// Comics cover consecutive runs of steps. Each strip is drawn with its panel
// captions underneath; any step no comic covers falls back to a plain row.
function renderStepDisplay(recipe){
  const comics = (recipe.comics || []).filter(comic => comic.stepRange);
  if(comics.length === 0){
    return recipe.steps.map((step, idx) => plainStepRow(recipe, idx)).join("");
  }

  const covered = new Set();
  const ordered = [...comics].sort((a, b) => a.stepRange[0] - b.stepRange[0]);
  const blocks = [];
  let cursor = 0;

  for(const comic of ordered){
    const from = Math.max(1, comic.stepRange[0]) - 1;
    const to = Math.min(recipe.steps.length, comic.stepRange[1]) - 1;

    // Any steps before this strip that nothing illustrates.
    for(let idx = cursor; idx < from; idx++){
      if(!covered.has(idx)){ blocks.push(plainStepRow(recipe, idx)); covered.add(idx); }
    }

    const captions = [];
    for(let idx = from; idx <= to; idx++){
      if(idx < 0 || idx >= recipe.steps.length) continue;
      covered.add(idx);
      const panel = comic.panels.find(p => p.stepIndex === idx);
      const title = panel?.caption || (recipe.stepTitles && recipe.stepTitles[idx]) || "";
      captions.push(`
        <div class="comic-caption">
          <span class="step-num">${idx + 1}</span>
          <span>
            ${title && title !== recipe.steps[idx] ? `<b>${escapeHtml(title)}</b>` : ""}
            <span class="txt">${escapeHtml(recipe.steps[idx])}</span>
          </span>
        </div>`);
    }

    blocks.push(`
      <div class="comic-strip">
        <div class="comic-strip-head">
          <span class="comic-badge">Part ${comic.index + 1}</span>
          <span class="hint">Steps ${from + 1}${to > from ? "-" + (to + 1) : ""}</span>
        </div>
        <img src="${escapeHtml(rawUrl(comic.path))}" alt="${escapeHtml(comic.name)}" loading="lazy">
        <div class="comic-captions">${captions.join("")}</div>
      </div>`);

    cursor = to + 1;
  }

  for(let idx = cursor; idx < recipe.steps.length; idx++){
    if(!covered.has(idx)) blocks.push(plainStepRow(recipe, idx));
  }
  return blocks.join("");
}

      steps:overlay.querySelector("#f-steps").value.split("\n").map(s => s.trim()).filter(Boolean),
      notes:overlay.querySelector("#f-notes").value.trim(),
      // Keep existing artwork when the author opts out of redrawing.
      comics:existing ? existing.comics : []
    });
    try{
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      let toSave = rec;
      if(makeComics.checked && rec.steps.length){
        try{
          toSave = await generateRecipeComics(rec, msg => {
            statusEl.innerHTML = `<div class="status-line">${escapeHtml(msg)}</div>`;
          });
        }catch(e){
          // Comics are a bonus, never a gate on saving the recipe.
          statusEl.innerHTML = `<div class="error-msg">Comics failed (${escapeHtml(e.message)}). Saving the recipe without them...</div>`;
          toSave = {...rec, comics:[]};
        }
      }

      statusEl.innerHTML = `<div class="status-line">Saving to GitHub...</div>`;
      const saved = await saveRecipeToGithub(toSave, existing);
      if(saved){
        overlay.remove();
        showToast(`Saved "${rec.title}"`);
      }else{
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Recipe";
        statusEl.innerHTML = `<div class="error-msg">GitHub access is required before saving.</div>`;
      }
    }catch(e){
      saveBtn.disabled = false;
      saveBtn.textContent = "Save Recipe";
      statusEl.innerHTML = `<div class="error-msg">Could not save to GitHub: ${escapeHtml(githubPermissionHint(e.message))}</div>`;
      lastError = "Could not save recipe (" + (e.message || "GitHub error") + ").";
      render();
    }
  };
}

function parseRecipeText(raw){
  const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const recipe = {title:lines[0] || "Untitled Recipe", category:"Other", servings:"", contributor:"", ingredients:[], steps:[], notes:""};
  let section = "ingredients";
  for(const line of lines.slice(1)){
    const lower = line.toLowerCase().replace(/:$/, "");
    if(CATEGORIES.map(c => c.toLowerCase()).includes(lower)){ recipe.category = CATEGORIES.find(c => c.toLowerCase() === lower); continue; }
    if(/^serv(es|ings?)\b/i.test(line)){ recipe.servings = line.replace(/^serv(es|ings?)\s*:?\s*/i, ""); continue; }
    if(/^from\b|^by\b/i.test(line)){ recipe.contributor = line.replace(/^(from|by)\s*:?\s*/i, ""); continue; }
    if(/ingredient/i.test(lower)){ section = "ingredients"; continue; }
    if(/instruction|direction|method|step/i.test(lower)){ section = "steps"; continue; }
    if(/note/i.test(lower)){ section = "notes"; continue; }
    const cleaned = line.replace(/^[-*•]\s*/, "").replace(/^\d+[.)]\s*/, "");
    if(section === "steps") recipe.steps.push(cleaned);
    else if(section === "notes") recipe.notes += (recipe.notes ? " " : "") + cleaned;
    else recipe.ingredients.push(cleaned);
  }
  return normalizeRecipe(recipe);
}

function recipesFromJson(parsed){
  if(Array.isArray(parsed)) return parsed;
  if(parsed && Array.isArray(parsed.recipes)) return parsed.recipes;
  if(parsed && parsed.recipe) return [parsed.recipe];
  return [parsed];
}

function cleanJsonInput(raw){
  let text = String(raw || "").trim();
  if(text.startsWith("```")){
    text = text.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "").trim();
  }
  return text;
}

function parseRecipeJson(raw){
  const text = cleanJsonInput(raw);
  if(!text) throw new Error("Paste recipe JSON first.");
  const parsed = JSON.parse(text);
  const incoming = recipesFromJson(parsed).filter(Boolean);
  if(incoming.length === 0) throw new Error("No recipes were found in that JSON.");
  return incoming;
}

function openImport(prefill = ""){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal wide">
      <button class="modal-close">&times;</button>
      <h2>Add Recipe JSON</h2>
      <div class="rule"></div>
      <div class="tool-box">
        <label style="margin-top:0">Paste recipe JSON</label>
        <textarea id="import-input" rows="12" placeholder='Paste one recipe, {"recipe": ...}, or {"recipes": [...]} here. Imported recipes are committed to GitHub.'>${escapeHtml(prefill)}</textarea>
        <div class="confirm-row" style="margin-top:12px;">
          <input type="checkbox" id="import-comics" checked style="width:auto;">
          <label for="import-comics" style="margin:0;">Draw comic strips for each imported recipe</label>
        </div>
        <div class="modal-actions">
          <button class="btn-primary" id="import-run">Import to GitHub</button>
          <button class="btn-ghost" id="import-file">Choose File</button>
          <input type="file" id="file-input" accept="application/json,.json" hidden>
        </div>
        <div id="import-status"></div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const input = overlay.querySelector("#import-input");
  const fileInput = overlay.querySelector("#file-input");
  overlay.querySelector(".modal-close").onclick = () => overlay.remove();
  overlay.querySelector("#import-file").onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => { input.value = reader.result; };
    reader.readAsText(file);
  };
  overlay.querySelector("#import-run").onclick = async () => {
    if(!requireGithubWrite()) return;
    const importBtn = overlay.querySelector("#import-run");
    const status = overlay.querySelector("#import-status");
    try{
      importBtn.disabled = true;
      status.innerHTML = `<div class="status-line">Reading JSON...</div>`;
      const incoming = parseRecipeJson(input.value);
      const normalized = incoming.map(normalizeRecipe);
      const withComics = overlay.querySelector("#import-comics").checked;
      for(const rec of normalized){
        let toSave = {...rec, id:uid()};
        if(withComics && toSave.steps.length){
          try{
            toSave = await generateRecipeComics(toSave, msg => {
              status.innerHTML = `<div class="status-line">${escapeHtml(rec.title)}: ${escapeHtml(msg)}</div>`;
            });
          }catch(e){
            status.innerHTML = `<div class="error-msg">Comics failed for ${escapeHtml(rec.title)} (${escapeHtml(e.message)}). Importing without them...</div>`;
            toSave = {...toSave, comics:[]};
          }
        }
        status.innerHTML = `<div class="status-line">Saving ${escapeHtml(rec.title)}...</div>`;
        await saveRecipeToGithub(toSave, null);
      }
      overlay.remove();
      showToast(`Imported ${normalized.length} recipe${normalized.length === 1 ? "" : "s"}`);
    }catch(e){
      importBtn.disabled = false;
      status.innerHTML = `<div class="error-msg">Could not import JSON: ${escapeHtml(githubPermissionHint(e.message))}</div>`;
    }
  };
}

function openGithubSettings(){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal wide">
      <button class="modal-close">&times;</button>
      <h2>GitHub Access</h2>
      <div class="rule"></div>
      <div class="tool-box">
        <div class="status-line">
          Repo: ${GITHUB_OWNER}/${GITHUB_REPO}<br>
          Data branch: ${DATA_BRANCH}<br>
          Public reads refresh every ${Math.round(POLL_MS / 1000)} seconds.
        </div>
        <label>GitHub Username</label>
        <input type="text" id="gh-user" value="${escapeHtml(githubUser)}" placeholder="your-github-username">
        <label>Fine-grained token</label>
        <input type="text" id="gh-token" value="${escapeHtml(githubToken)}" placeholder="Contents: Read and write for this repo">
        <div class="hint">The token is kept in this browser tab session only. It is needed only for adding, editing, deleting, or importing recipes.</div>
        <div class="modal-actions">
          <button class="btn-primary" id="gh-save">Save Access</button>
          <button class="btn-ai" id="gh-test">Test</button>
          <button class="btn-danger" id="gh-clear">Clear</button>
        </div>
        <div id="gh-status"></div>
      </div>
      <div class="tool-box" style="margin-top:16px;">
        <div class="field-label" style="margin-top:0;">Comic Service</div>
        <label>Service URL</label>
        <input type="text" id="comic-url" value="${escapeHtml(localStorage.getItem(COMIC_API_KEY) || "")}" placeholder="${escapeHtml(comicApiBase())}">
        <div class="hint">Leave blank to use this site's own origin. The Groq API key lives on the server and is never sent to the browser.</div>
        <div class="modal-actions">
          <button class="btn-primary" id="comic-save">Save URL</button>
          <button class="btn-ai" id="comic-test">Test Service</button>
        </div>
        <div id="comic-status"></div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const userInput = overlay.querySelector("#gh-user");
  const tokenInput = overlay.querySelector("#gh-token");
  const status = overlay.querySelector("#gh-status");
  function storeAccess(){
    githubUser = userInput.value.trim();
    githubToken = tokenInput.value.trim();
    if(githubUser) sessionStorage.setItem(USER_KEY, githubUser); else sessionStorage.removeItem(USER_KEY);
    if(githubToken) sessionStorage.setItem(TOKEN_KEY, githubToken); else sessionStorage.removeItem(TOKEN_KEY);
  }
  overlay.querySelector(".modal-close").onclick = () => overlay.remove();
  overlay.querySelector("#gh-save").onclick = () => {
    storeAccess();
    showToast("GitHub access saved");
    overlay.remove();
  };
  overlay.querySelector("#gh-clear").onclick = () => {
    githubUser = "";
    githubToken = "";
    sessionStorage.removeItem(USER_KEY);
    sessionStorage.removeItem(TOKEN_KEY);
    showToast("GitHub access cleared");
    overlay.remove();
  };
  const comicUrl = overlay.querySelector("#comic-url");
  const comicStatus = overlay.querySelector("#comic-status");
  overlay.querySelector("#comic-save").onclick = () => {
    const value = comicUrl.value.trim().replace(/\/+$/, "");
    if(value) localStorage.setItem(COMIC_API_KEY, value);
    else localStorage.removeItem(COMIC_API_KEY);
    showToast("Comic service URL saved");
  };
  overlay.querySelector("#comic-test").onclick = async () => {
    const value = comicUrl.value.trim().replace(/\/+$/, "");
    if(value) localStorage.setItem(COMIC_API_KEY, value);
    else localStorage.removeItem(COMIC_API_KEY);
    comicStatus.innerHTML = `<div class="status-line">Contacting ${escapeHtml(comicApiBase())}...</div>`;
    try{
      const health = await comicServiceHealth();
      comicStatus.innerHTML = health.groq?.configured
        ? `<div class="status-line">Service is up. Groq model ${escapeHtml(health.groq.model)}, artwork by ${escapeHtml(health.image.active)}. Up to ${health.limits.maxSteps} steps across ${health.limits.maxChunks} comics.</div>`
        : `<div class="error-msg">Service is up but GROQ_API_KEY is not configured on it.</div>`;
    }catch(e){
      comicStatus.innerHTML = `<div class="error-msg">Comic service unreachable: ${escapeHtml(e.message)}. A free Render service sleeps when idle - try again in a minute.</div>`;
    }
  };

  overlay.querySelector("#gh-test").onclick = async () => {
    storeAccess();
    if(!githubUser || !githubToken){
      status.innerHTML = `<div class="error-msg">Enter both username and token.</div>`;
      return;
    }
      status.innerHTML = `<div class="status-line">Testing GitHub read/write access...</div>`;
    try{
      await testGithubWriteAccess();
      status.innerHTML = `<div class="status-line">Token can write to ${GITHUB_OWNER}/${GITHUB_REPO}. Saving recipes should work.</div>`;
    }catch(e){
      status.innerHTML = `<div class="error-msg">GitHub test failed: ${escapeHtml(githubPermissionHint(e.message))}</div>`;
    }
  };
}

function exportBox(){
  const blob = new Blob([JSON.stringify({
    format:"family-recipe-box.export.v1",
    recipes:recipes.map(recipeForStorage)
  }, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "family-recipe-box.json";
  document.body.appendChild(a);
  a.click();
  URL.revokeObjectURL(a.href);
  a.remove();
}
